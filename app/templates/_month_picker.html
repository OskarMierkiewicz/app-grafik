{# Wybieracz miesiąca (patrz static/monthpicker.js). Bez JavaScriptu to zwykłe pole tekstowe RRRR-MM. #}
{% macro month_picker(value, marks=[], autosubmit=True) -%}
<span class="mp" data-mp data-marks="{{ marks|join(',') }}"{% if autosubmit %} data-autosubmit{% endif %}>
  <input type="text" name="month" value="{{ value }}" pattern="[0-9]{4}-[0-9]{2}" size="8" required aria-label="Miesiąc (RRRR-MM)">
</span>
{%- endmacro %}
